# Apache vhost for lifesim.wtatari.com -> static build in /var/www/lifesim
#
# A SEPARATE site on this Pi; it does not touch wtatari.com, api, fm, floor,
# live or quoter. LifeSim is a fully client-side app (saves live in the
# browser's IndexedDB), so this only serves files -- no proxy, no backend.
#
# Install: deploy/deploy.sh --setup

<VirtualHost *:80>
    ServerName lifesim.wtatari.com
    DocumentRoot /var/www/lifesim
    <Directory /var/www/lifesim>
        Require all granted
        Options -Indexes
    </Directory>

    RewriteEngine on
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName lifesim.wtatari.com
    DocumentRoot /var/www/lifesim

    ErrorLog  ${APACHE_LOG_DIR}/lifesim-error.log
    CustomLog ${APACHE_LOG_DIR}/lifesim-access.log combined

    <Directory /var/www/lifesim>
        Require all granted
        Options -Indexes
        AllowOverride None
    </Directory>

    <IfModule mod_headers.c>
        # Vite fingerprints everything under assets/, so it can be cached forever;
        # index.html must always be revalidated so a new deploy shows up at once.
        <LocationMatch "^/assets/">
            Header always set Cache-Control "public, max-age=31536000, immutable"
        </LocationMatch>
        <LocationMatch "^/(index\.html)?$">
            Header always set Cache-Control "no-cache"
        </LocationMatch>
        Header always set X-Content-Type-Options "nosniff"
    </IfModule>

    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/css application/javascript text/javascript image/svg+xml application/json
    </IfModule>

    SSLCertificateFile /etc/letsencrypt/live/lifesim.wtatari.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/lifesim.wtatari.com/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
